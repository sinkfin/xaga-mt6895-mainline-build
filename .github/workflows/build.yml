name: Build Boot

# xaga (Redmi Note 11T Pro / MT6895 / 天玑8100) 主线内核 + RootFS 构建
# boot 头部参数与 postmarketOS wiki 保持一致, 见 README「Boot镜像头部参数」
on:
  workflow_dispatch:
    inputs:
      build_target:
        description: '构建任务: boot=仅构建Boot镜像 / rootfs=仅构建RootFS镜像 / all=构建Boot镜像和RootFS镜像'
        required: true
        default: 'boot'
        type: choice
        options: ['boot', 'rootfs', 'all']
      kernel_branch:
        description: '内核分支: 7.2 功能最新 / 6.18 更保守'
        required: true
        default: '7.2-mt6895-xiaomi-xaga'
        type: choice
        options:
          - '7.2-mt6895-xiaomi-xaga'
          - '6.18-mt6895-xiaomi-xaga'
      initramfs_userdata:
        description: 'initramfs userdata 设备节点 (xaga 上是 /dev/sdc86 = userdata, 不是 fastboot 分区名, 别乱改)'
        required: true
        default: '/dev/sdc86'
        type: string
      initramfs_nvdata:
        description: 'initramfs NVRAM 分区 (xaga 是 /dev/sdc13, 取 WiFi/BT NVRAM)'
        required: true
        default: '/dev/sdc13'
        type: string
      build_kernel:
        description: 'kernel: 需要编译就打勾; 取消勾选则复用 RUNS ID 的内核产物 (没填 RUNS ID 就按默认编译)'
        required: false
        default: true
        type: boolean
      build_initramfs:
        description: 'initramfs: 需要编译就打勾; 取消勾选则复用 RUNS ID 的 initramfs 产物 (没填 RUNS ID 就按默认编译)'
        required: false
        default: true
        type: boolean
      reuse_run_id:
        description: 'RUNS ID: 留空=正常编译内核和initramfs; 填 35342958852 则按上面开关复用该 Run 的 Image-<时间戳>.gz 和 initramfs-<时间戳>.cpio.lz4'
        required: false
        default: ''
        type: string
      build_modules:
        description: 'modules: 需要编译就打勾; 不勾选=本次一定不编译, 只在填了 RUNS ID 时复用该 Run 的 kernel-modules 产物(没有该产物则回退成编译); 仓库变量 BUILD_MODULES=false 时勾不勾都不编'
        required: false
        default: true
        type: boolean
      rootfs_distro:
        description: 'rootfs 发行版: arch=Arch Linux ARM / debian=Debian 13 / ubuntu=Ubuntu 26.04 LTS'
        required: true
        default: 'ubuntu'
        type: choice
        options: ['arch', 'debian', 'ubuntu']
      arch_desktop:
        description: 'Arch Linux ARM 的桌面环境 (仅 rootfs 发行版选 arch 时生效)'
        required: true
        default: 'kde'
        type: choice
        options: ['kde', 'none', 'phosh', 'sway']
      rootfs_size:
        description: 'rootfs 初始镜像容量 (GB, 纯数字): 6 够用, 完整桌面 10~16; 刷入后首次开机 resize2fs 撑满 userdata'
        required: true
        default: '6'
        type: string
      rootfs_hostname:
        description: 'rootfs 主机名'
        required: true
        default: 'xaga'
        type: string
      rootfs_root_password:
        description: 'rootfs root 密码'
        required: true
        default: 'root'
        type: string
      rootfs_extra_packages:
        description: 'rootfs 额外包: 空格分隔 (Arch 用包名)'
        required: false
        default: ''
        type: string
      wifi_ssid:
        description: 'rootfs 预置 WiFi 名称 (留空不预置)'
        required: false
        default: ''
        type: string
      wifi_password:
        description: 'rootfs 预置 WiFi 密码 (留空不预置)'
        required: false
        default: ''
        type: string
      collect_artifacts:
        description: '汇总产物: 汇总所有产物并做 Release 前的收尾'
        required: false
        default: true
        type: boolean
      publish_release:
        description: '发布 Release: 发布到 GitHub Release (永久资源, 不过期)'
        required: false
        default: true
        type: boolean
      send_notification:
        description: '构建完成推送通知 (喵提醒 / Server酱)'
        required: false
        default: true
        type: boolean

  # 每日两次自动检测上游内核 / initramfs 更新, 有更新则 bot.py 自动触发一次 boot 构建
  schedule:
    - cron: '0 0,12 * * *'

permissions:
  contents: write   # Release / 提交上游记录
  actions: write    # 触发构建 / 清理缓存

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 上游更新检测 (仅 schedule 触发): bot.py 对比 build-state.json, 有更新就自动触发构建
  # ---------------------------------------------------------------------------
  upstream-check:
    name: 检测上游更新
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 检测上游内核 / initramfs 更新
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          KERNEL_BRANCH: 7.2-mt6895-xiaomi-xaga
        run: python3 .github/bot.py --check-update --auto-build --commit-patch

  # ---------------------------------------------------------------------------
  # 参数归一化: 时间戳 / 构建目标 / 复用 Run ID
  # ---------------------------------------------------------------------------
  prepare:
    name: 准备参数
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ts: ${{ steps.vars.outputs.ts }}
      target: ${{ steps.vars.outputs.target }}
      short_target: ${{ steps.vars.outputs.short_target }}
    steps:
      - name: 计算时间戳与构建目标
        id: vars
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.build_target }}
        run: |
          set -euo pipefail
          echo "ts=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          if [ "${EVENT}" = "workflow_dispatch" ] && [ -n "${INPUT_TARGET}" ]; then
            target="${INPUT_TARGET}"
          else
            target="boot"
          fi
          echo "target=${target}" >> "$GITHUB_OUTPUT"
          case "${target}" in
            boot)   echo "short_target=Boot镜像" >> "$GITHUB_OUTPUT" ;;
            rootfs) echo "short_target=RootFS镜像" >> "$GITHUB_OUTPUT" ;;
            *)      echo "short_target=Boot镜像+RootFS镜像" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "本次任务: ${target}"

  # ---------------------------------------------------------------------------
  # Boot 镜像: initramfs + 内核(Clang 18 / LLVM=1) + mkbootimg v4 打包
  # ---------------------------------------------------------------------------
  build-boot:
    name: 构建 Boot 镜像
    needs: prepare
    if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.target != 'rootfs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      ARCH: arm64
      TS: ${{ needs.prepare.outputs.ts }}
      KERNEL_REPO: MT6895-Mainline/linux
      INITRAMFS_REPO: MT6895-Mainline/initramfs
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      BUILD_KERNEL: ${{ inputs.build_kernel }}
      BUILD_INITRAMFS: ${{ inputs.build_initramfs }}
      # modules 总开关: 仓库变量(Settings → Secrets and variables → Actions → Variables) BUILD_MODULES
      # 设为 false / 0 时, 复选框勾不勾都不编模块; 其余值(含未设置)都以复选框为准
      BUILD_MODULES: ${{ inputs.build_modules && vars.BUILD_MODULES != 'false' && vars.BUILD_MODULES != '0' }}
      # 原始值单独留一份: 判定步骤要区分"没勾选"和"总开关被关掉"
      BUILD_MODULES_VAR: ${{ vars.BUILD_MODULES }}
      REUSE_RUN_ID: ${{ inputs.reuse_run_id }}
      BOOT_PARTITION: ${{ inputs.initramfs_userdata }}
      NVDATA_PARTITION: ${{ inputs.initramfs_nvdata }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /usr/local/.ghcup /usr/local/share/boost || true
          df -h / | tail -1

      - name: 安装编译依赖 (Clang 18 / LLVM)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-18 lld-18 llvm-18 \
            flex bison bc libssl-dev libelf-dev libncurses-dev \
            cpio lz4 xz-utils zstd kmod rsync pigz git curl ca-certificates \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # LLVM=1 会直接调 clang / ld.lld / llvm-*, 统一建软链到 /usr/local/bin
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump \
                   llvm-readelf llvm-strip llvm-size llvm-ranlib; do
            for p in /usr/bin /usr/lib/llvm-18/bin; do
              if [ -x "$p/$t-18" ]; then sudo ln -sf "$p/$t-18" "/usr/local/bin/$t"; break; fi
              if [ -x "$p/$t" ];    then sudo ln -sf "$p/$t"    "/usr/local/bin/$t"; break; fi
            done
          done
          hash -r
          clang --version | head -1
          ld.lld --version | head -1
          clang --version | head -1 | grep -q 'clang version 18' \
            || { echo "::error::需要 Clang 18 (README: Clang 18 全链路编译, 禁用 GCC)"; exit 1; }

      - name: 准备 mkbootimg (保证 v4 header_size=1584)
        run: |
          set -euo pipefail
          smoke() {
            local cmd="$1" out="/tmp/smoke-boot.img"
            head -c 4096 /dev/zero > /tmp/smoke-k.gz
            head -c 8192 /dev/zero > /tmp/smoke-r.cpio
            rm -f "$out"
            if ! $cmd --kernel /tmp/smoke-k.gz --ramdisk /tmp/smoke-r.cpio \
                  --base 0x3fff8000 --kernel_offset 0x8000 --pagesize 4096 \
                  --ramdisk_offset 0x26f08000 --tags_offset 0x07c88000 --dtb_offset 0x07c88000 \
                  --header_version 4 --os_version 16.0.0 --os_patch_level 2026-08 \
                  -o "$out" >/tmp/smoke.log 2>&1; then
              echo "smoke 打包失败:"; tail -20 /tmp/smoke.log
              return 1
            fi
            local hs ver
            ver=$(od -An -tu4 -j40 -N4 "$out" | tr -d ' ')
            hs=$(od -An -tu4 -j20 -N4 "$out" | tr -d ' ')
            echo "smoke: header_version=${ver} header_size=${hs} (期望 4 / 1584)"
            [ "$ver" = "4" ] && [ "$hs" = "1584" ]
          }
          CMD=""
          if sudo git clone --depth 1 --quiet \
               https://android.googlesource.com/platform/system/tools/mkbootimg /opt/mkbootimg 2>/dev/null \
             && smoke "python3 /opt/mkbootimg/mkbootimg.py"; then
            CMD="python3 /opt/mkbootimg/mkbootimg.py"
          elif sudo apt-get install -y -qq mkbootimg >/dev/null 2>&1 \
             && smoke "$(command -v mkbootimg)"; then
            CMD="$(command -v mkbootimg)"
          else
            echo "::error::拿不到能产出 v4 (header_size=1584) 的 mkbootimg。"
            echo "::error::osm0sis C 版只实现到 boot_img_hdr_v3 (header_size 恒 1580), 会产出畸形头, 不能用。"
            exit 1
          fi
          echo "MKBOOTIMG_CMD=${CMD}" >> "$GITHUB_ENV"
          echo "使用打包器: ${CMD}"

      # === 内核模块来源判定 ===
      # 规则:
      #   勾选 modules                      -> 本次编译 (编模块必须有内核源码树, 内核也在复用的话连内核一起编)
      #   不勾选 + 填了 RUNS ID              -> 一定不编译, 复用该 Run 的 kernel-modules 产物
      #   不勾选 + 该 Run 没有该产物         -> 回退成编译 (同时清空 REUSE_RUN_ID, 内核/initramfs 也改为本次编译)
      #   不勾选 + 没填 RUNS ID              -> 不编译也不复用, 本次不产出 modules
      # 这一步必须排在所有"复用"步骤之前 —— 回退编译时靠清空 REUSE_RUN_ID 让后面所有步骤切回"本次编译"。
      - name: 判定内核模块来源 (编译 / 复用 RUNS ID / 不产出)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out reuse/modules
          case "${BUILD_MODULES}" in
            true|false) ;;
            *) echo "::warning::BUILD_MODULES 取值异常 ('${BUILD_MODULES}'), 按 false 处理 (不编译也不复用)" ;;
          esac

          # 0) 总开关关 (仓库变量 BUILD_MODULES=false/0) -> 硬关: 不编译, 也不复用, 连回退编译都不做
          if [ "${BUILD_MODULES_VAR:-}" = "false" ] || [ "${BUILD_MODULES_VAR:-}" = "0" ]; then
            echo "MODULES_SOURCE=none" >> "$GITHUB_ENV"
            echo "::warning::仓库变量 BUILD_MODULES=${BUILD_MODULES_VAR} (总开关关): 本次既不编译也不复用内核模块"
            exit 0
          fi

          kernel_compiled=0
          if [ "${BUILD_KERNEL}" = "true" ] || [ -z "${REUSE_RUN_ID:-}" ]; then
            kernel_compiled=1
          fi

          # 1) 勾了 modules 且本次会编内核 -> 直接编译
          if [ "${BUILD_MODULES}" = "true" ] && [ "${kernel_compiled}" = "1" ]; then
            echo "MODULES_SOURCE=compile" >> "$GITHUB_ENV"
            echo "内核模块: 本次编译"
            exit 0
          fi

          # 2) 没填 RUNS ID -> 不编译也不复用 (不勾选=一定不编译)
          if [ -z "${REUSE_RUN_ID:-}" ]; then
            echo "MODULES_SOURCE=none" >> "$GITHUB_ENV"
            echo "::warning::modules 未勾选(或 BUILD_MODULES=false) 且没填 RUNS ID: 本次不编译也不复用, 不产出 kernel-modules 产物"
            exit 0
          fi

          # 3) 复用该 Run 的 kernel-modules 产物
          if [ "${kernel_compiled}" = "0" ]; then
            if [ "${BUILD_MODULES}" = "true" ]; then
              echo "::notice::modules 打勾了, 但内核 Image 是复用来的 —— 模块必须跟内核同一棵树编, 这里只能跟着复用 RUNS ID 的产物 (要真编就同时勾上 kernel)"
            else
              echo "本次不编内核 (复用 Image), 内核模块只能跟着复用 RUNS ID 的产物"
            fi
          fi
          why=""
          if ! err="$(gh run download "${REUSE_RUN_ID}" -R "${{ github.repository }}" -n kernel-modules -D reuse/modules 2>&1)"; then
            why="gh run download 失败"
          else
            src="$(ls -1 reuse/modules/modules-*.tar.gz 2>/dev/null | head -1 || true)"
            if [ -n "${src}" ]; then
              cp "$src" "out/modules-${TS}.tar.gz"
              echo "MODULES_SOURCE=reuse" >> "$GITHUB_ENV"
              echo "复用内核模块产物: ${src} -> out/modules-${TS}.tar.gz"
              exit 0
            fi
            why="下载成功但里面没有 modules-*.tar.gz"
          fi

          # 4) 复用不到 -> 回退成编译
          echo "::warning::RUNS ID ${REUSE_RUN_ID} 复用不到内核模块 (${why}), 回退为本次编译内核模块"
          printf '%s\n' "${err:-}" | sed 's/^/    /' || true
          echo "MODULES_SOURCE=compile" >> "$GITHUB_ENV"
          if [ "${kernel_compiled}" = "0" ]; then
            echo "::warning::编内核模块必须有内核源码树: 内核原本要复用 Image, 本次改成编译内核 (已清空 REUSE_RUN_ID, initramfs 也会重新编)"
            echo "REUSE_RUN_ID=" >> "$GITHUB_ENV"
          fi

      - name: 复用 RUNS ID 的内核 Image
        if: ${{ env.REUSE_RUN_ID != '' && env.BUILD_KERNEL != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out reuse/kernel
          gh run download "${REUSE_RUN_ID}" -R "${{ github.repository }}" -n kernel-image -D reuse/kernel
          src=$(ls -1t reuse/kernel/Image-*.gz | head -1)
          cp "$src" "out/Image-${TS}.gz"
          echo "复用内核产物: $src -> out/Image-${TS}.gz"

      - name: 复用 RUNS ID 的 initramfs
        if: ${{ env.REUSE_RUN_ID != '' && env.BUILD_INITRAMFS != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p out reuse/initramfs
          gh run download "${REUSE_RUN_ID}" -R "${{ github.repository }}" -n initramfs-image -D reuse/initramfs
          src=$(ls -1t reuse/initramfs/initramfs-*.cpio.lz4 | head -1)
          cp "$src" "out/initramfs-${TS}.cpio.lz4"
          echo "复用 initramfs 产物: $src -> out/initramfs-${TS}.cpio.lz4"

      - name: 恢复内核编译缓存
        if: ${{ env.BUILD_KERNEL == 'true' || env.REUSE_RUN_ID == '' }}
        uses: actions/cache@v4
        with:
          # 内核源码树 + 编译产物 (obj), 配合下面的 fetch/checkout 做增量编译
          path: linux
          key: kernel-${{ inputs.kernel_branch || '7.2-mt6895-xiaomi-xaga' }}-${{ github.run_id }}
          restore-keys: |
            kernel-${{ inputs.kernel_branch || '7.2-mt6895-xiaomi-xaga' }}-

      - name: 编译 initramfs
        if: ${{ env.BUILD_INITRAMFS == 'true' || env.REUSE_RUN_ID == '' }}
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -euo pipefail
          mkdir -p out
          git clone --depth 1 "https://github.com/${INITRAMFS_REPO}.git" initramfs
          cd initramfs
          make clean || true
          # BOOT_PARTITION = userdata (xaga 上是 /dev/sdc86), NVDATA_PARTITION = nvdata (/dev/sdc13)
          make BOOT_PARTITION="${BOOT_PARTITION:-/dev/sdc86}" \
               NVDATA_PARTITION="${NVDATA_PARTITION:-/dev/sdc13}"
          ls -l initramfs.cpio.lz4
          cp initramfs.cpio.lz4 "../out/initramfs-${TS}.cpio.lz4"

      - name: 编译内核 (Clang 18 / LLVM=1)
        if: ${{ env.BUILD_KERNEL == 'true' || env.REUSE_RUN_ID == '' }}
        run: |
          set -euo pipefail
          mkdir -p out
          branch="${KERNEL_BRANCH:-7.2-mt6895-xiaomi-xaga}"
          if [ -d linux/.git ]; then
            git -C linux remote set-url origin "https://github.com/${KERNEL_REPO}.git"
            git -C linux fetch --depth 1 origin "$branch"
            git -C linux checkout -f FETCH_HEAD
          else
            git clone --depth 1 --branch "$branch" "https://github.com/${KERNEL_REPO}.git" linux
          fi
          cd linux
          ARCH=arm64 scripts/kconfig/merge_config.sh \
            arch/arm64/configs/defconfig arch/arm64/configs/xaga.config
          make ARCH=arm64 LLVM=1 olddefconfig
          # 防御断言: CONFIG_INITRAMFS_FORCE=y 会让内核直接跳过 boot.img 里的 initramfs
          #   init/initramfs.c: if (!initrd_start || IS_ENABLED(CONFIG_INITRAMFS_FORCE)) goto done;
          # 再叠加 CONFIG_CMDLINE_FORCE=y(没有 root=), 结果必然是 VFS panic -> 卡第一 logo 重启。
          # 上游在 09-20 的 VCP merge 里误开过一次, 09-22 由 1bd83bb58a 修掉。
          if grep -qx 'CONFIG_INITRAMFS_FORCE=y' .config; then
            echo "::error::CONFIG_INITRAMFS_FORCE=y: 内核会忽略 boot.img 里的 initramfs, 刷上必卡 logo 重启"
            echo "::error::换 6.18 分支, 或等上游把 xaga.config 改回来再编"
            exit 1
          fi
          echo "initramfs / cmdline 相关配置:"
          grep -E '^CONFIG_(BLK_DEV_INITRD|INITRAMFS_FORCE|CMDLINE|CMDLINE_FORCE)=' .config || true
          make ARCH=arm64 LLVM=1 -j"$(nproc --all)" Image
          gzip -n -9 -c arch/arm64/boot/Image > "../out/Image-${TS}.gz"
          ls -l "../out/Image-${TS}.gz"

      - name: 断言 Image 内嵌了 xaga 板级 DTB
        if: ${{ env.BUILD_KERNEL == 'true' || env.REUSE_RUN_ID == '' }}
        run: |
          set -euo pipefail
          # xaga 的 DTB 是 objcopy 链进 vmlinux 的 (不是 appended), 所以 mkbootimg 不能传 --dtb。
          # 万一哪天上游改了嵌入方式 / defconfig 把 DTB 弄丢了, 编出来的镜像能打包能过头部校验,
          # 但刷上就是黑屏 —— 这里直接拦住。
          python3 - linux/arch/arm64/boot/Image <<'PY'
          import sys

          path = sys.argv[1]
          MAGIC = b"\xd0\x0d\xfe\xed"
          CHUNK = 8 << 20
          WINDOW = 65536
          hits, with_xaga = [], []
          with open(path, "rb") as f:
              prev = b""
              base = 0
              while True:
                  buf = f.read(CHUNK)
                  if not buf:
                      break
                  data = prev + buf
                  start = 0
                  while True:
                      i = data.find(MAGIC, start)
                      if i < 0:
                          break
                      hits.append(base + i)
                      if b"xaga" in data[i:i + WINDOW]:
                          with_xaga.append(base + i)
                      start = i + 1
                  base = base + len(data) - 8
                  prev = data[-8:]
          print("Image 里 DTB magic(d00dfeed) 命中 %d 处: %s" % (len(hits), hits[:5]))
          print("其中附近带 'xaga' 字符串的: %s" % (with_xaga[:5] or "无"))
          if not hits:
              print("::error::Image 里一个 DTB magic 都没有 —— 板级 DTB 没编进去, 别打包")
              sys.exit(1)
          if not with_xaga:
              print("::warning::找到 DTB 但附近没有 'xaga' 字符串, 人工确认一下是不是对的板级 DTB")
          PY

      - name: 打印内嵌 DTB 的 reserved-memory (排障用)
        if: ${{ env.BUILD_KERNEL == 'true' || env.REUSE_RUN_ID == '' }}
        run: |
          set -euo pipefail
          # MT6895 的 ATF/TEE/SCP/SSPM/MCUPM 内存是 bootloader 占着的, 必须靠 reserved-memory
          # 从内核手里划出去。上游有一次把这些地址整体改写过, 结果内核把活着的固件内存当普通
          # 内存分配, DMA 一踩页表就随机崩 (过 logo 后黑屏重启)。这里把表打进日志, 出问题时
          # 跟上一份能启动的对比一眼就能看出来。
          python3 - linux/arch/arm64/boot/Image <<'PY'
          import struct
          import sys

          path = sys.argv[1]
          with open(path, "rb") as f:
              raw = f.read()

          base = raw.find(b"\xd0\x0d\xfe\xed")
          if base < 0:
              print("::error::Image 里找不到 DTB magic, 板级 DTB 没编进去")
              sys.exit(1)

          magic, totalsize, off_struct, off_strings = struct.unpack_from(">IIII", raw, base)
          dtb = raw[base:base + totalsize]
          strs = dtb[off_strings:]
          p = off_struct
          cur = []
          nodes = []
          props = {}
          while p < len(dtb):
              tok = struct.unpack_from(">I", dtb, p)[0]
              p += 4
              if tok == 1:
                  e = dtb.index(b"\0", p)
                  name = dtb[p:e].decode("utf-8", "replace")
                  p = (e + 4) & ~3
                  cur.append(name)
                  nodes.append("/" + "/".join(cur))
              elif tok == 2:
                  if cur:
                      cur.pop()
              elif tok == 3:
                  plen, nameoff = struct.unpack_from(">II", dtb, p)
                  p += 8
                  nm = strs[nameoff:strs.index(b"\0", nameoff)].decode("utf-8", "replace")
                  props[("/" + "/".join(cur)) + "/" + nm] = dtb[p:p + plen]
                  p += plen
                  p = (p + 3) & ~3
              elif tok == 9:
                  break
              else:
                  break

          for k in ("/model", "/compatible"):
              if k in props:
                  print("%s = %s" % (k, props[k].rstrip(b"\0").decode("utf-8", "replace")))

          rm = sorted(n for n in nodes if n.startswith("//reserved-memory/") and n.count("/") == 3)
          print("reserved-memory 区域 %d 个:" % len(rm))
          for n in rm:
              reg = props.get(n + "/reg", b"")
              if len(reg) >= 16:
                  a, s = struct.unpack(">QQ", reg[:16])
                  print("  %-58s 0x%016x + 0x%x" % (n.split("/")[-1], a, s))
              else:
                  print("  %-58s (无 reg)" % n.split("/")[-1])

          if not rm:
              print("::error::内嵌 DTB 里没有 reserved-memory 区域 —— ATF/TEE/SCP/SSPM 的内存"
                    " 会被内核当普通内存分配, DMA 踩页表后开机随机崩")
              sys.exit(1)
          PY

      - name: 编译内核模块
        # 由「判定内核模块来源」决定: 只有它把 MODULES_SOURCE 置为 compile 才编
        # (勾选 modules / 复用 RUNS ID 失败回退). 不勾选时一定不编译。
        if: ${{ env.MODULES_SOURCE == 'compile' }}
        run: |
          set -euo pipefail
          cd linux
          make ARCH=arm64 LLVM=1 -j"$(nproc --all)" modules
          make ARCH=arm64 LLVM=1 INSTALL_MOD_PATH="$PWD/modout" INSTALL_MOD_STRIP=1 modules_install
          rm -f modout/lib/modules/*/build modout/lib/modules/*/source
          tar -C modout -czf "../out/modules-${TS}.tar.gz" lib
          ls -l "../out/modules-${TS}.tar.gz"

      - name: 打包 boot.img (MTK v4 头)
        run: |
          set -euo pipefail
          test -f "out/Image-${TS}.gz"
          test -f "out/initramfs-${TS}.cpio.lz4"
          # 头部参数必须与 postmarketOS wiki / README 一致, 别乱改
          # DTB 已 objcopy 链进 vmlinux, 所以不传 --dtb, 也不要拼 Image+dtb
          $MKBOOTIMG_CMD \
            --kernel "out/Image-${TS}.gz" \
            --ramdisk "out/initramfs-${TS}.cpio.lz4" \
            --base 0x3fff8000 --kernel_offset 0x8000 --pagesize 4096 \
            --ramdisk_offset 0x26f08000 --tags_offset 0x07c88000 --dtb_offset 0x07c88000 \
            --header_version 4 --os_version 16.0.0 --os_patch_level 2026-08 \
            -o "out/boot-${TS}.img"
          ls -l "out/boot-${TS}.img"

      - name: 校验 boot.img 头部 (v4 / header_size=1584)
        run: python3 .github/bot.py --verify-bootimg "out/boot-${TS}.img"

      - name: 上传 boot 镜像
        uses: actions/upload-artifact@v4
        with:
          name: boot-image
          path: out/boot-*.img
          if-no-files-found: error
          compression-level: 0

      - name: 上传内核 Image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: out/Image-*.gz
          if-no-files-found: warn
          compression-level: 0

      - name: 上传 initramfs
        uses: actions/upload-artifact@v4
        with:
          name: initramfs-image
          path: out/initramfs-*.cpio.lz4
          if-no-files-found: warn
          compression-level: 0

      - name: 上传内核模块
        uses: actions/upload-artifact@v4
        with:
          name: kernel-modules
          path: out/modules-*.tar.gz
          if-no-files-found: warn
          compression-level: 0

  # ---------------------------------------------------------------------------
  # RootFS: Arch Linux ARM / Debian 13 / Ubuntu 26.04 LTS, 只有 root 用户
  # ---------------------------------------------------------------------------
  build-rootfs:
    name: 构建 RootFS 镜像
    needs: prepare
    if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.target != 'boot' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      TS: ${{ needs.prepare.outputs.ts }}
      DISTRO: ${{ inputs.rootfs_distro }}
      ARCH_DESKTOP: ${{ inputs.arch_desktop }}
      IMG_SIZE: ${{ inputs.rootfs_size }}
      ROOTFS_HOSTNAME: ${{ inputs.rootfs_hostname }}
      ROOTFS_PASSWORD: ${{ inputs.rootfs_root_password }}
      EXTRA_PKGS: ${{ inputs.rootfs_extra_packages }}
      WIFI_SSID: ${{ inputs.wifi_ssid }}
      WIFI_PASSWORD: ${{ inputs.wifi_password }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /usr/local/.ghcup /usr/local/share/boost || true
          df -h / | tail -1

      - name: 安装 rootfs 构建依赖
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap qemu-user-static binfmt-support \
            e2fsprogs parted android-sdk-libsparse-utils pigz libarchive-tools \
            wget curl rsync xz-utils zstd
          sudo update-binfmts --enable qemu-aarch64 || true

      - name: 构建 rootfs 文件树
        run: |
          set -euo pipefail
          sudo rm -rf rootfs mnt
          sudo mkdir -p rootfs
          case "${DISTRO:-ubuntu}" in
            arch)
              echo "::group::下载 Arch Linux ARM aarch64 rootfs tarball"
              wget -q -O /tmp/alarm.tar.gz \
                "http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz"
              sudo bsdtar -xpf /tmp/alarm.tar.gz -C rootfs
              echo "::endgroup::"
              ;;
            debian|ubuntu)
              if [ "${DISTRO}" = "ubuntu" ]; then
                suite=resolute
                mirror=http://ports.ubuntu.com/ubuntu-ports
                comps=main,universe
              else
                suite=trixie
                mirror=http://deb.debian.org/debian
                comps=main,universe,non-free-firmware
              fi
              echo "::group::debootstrap ${suite} (arm64, --foreign)"
              sudo debootstrap --arch=arm64 --foreign --components="${comps}" \
                "${suite}" rootfs "${mirror}"
              sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/
              sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
              sudo chroot rootfs /debootstrap/debootstrap --second-stage
              echo "::endgroup::"
              ;;
            *)
              echo "::error::未知 rootfs 发行版: ${DISTRO}"; exit 1 ;;
          esac
          sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/ 2>/dev/null || true
          sudo cp /etc/resolv.conf rootfs/etc/resolv.conf
          echo "rootfs 文件树: $(sudo du -sh rootfs | cut -f1)"

      - name: 配置 rootfs (root 用户 / 主机名 / WiFi / 固件 / 额外包)
        run: |
          set -euo pipefail
          sudo tee rootfs/tmp/xaga-setup.sh >/dev/null <<'SETUP'
          #!/bin/bash
          # xaga rootfs 配置: 只有 root 用户, 不创建普通用户
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          HOSTNAME="$1"; ROOT_PASS="$2"; WIFI_SSID="$3"; WIFI_PASS="$4"; EXTRA="$5"; DESKTOP="$6"

          printf '%s\n' "$HOSTNAME" > /etc/hostname
          printf '127.0.0.1\tlocalhost\n127.0.1.1\t%s\n' "$HOSTNAME" > /etc/hosts

          # root 密码; 只保留 root 用户
          echo "root:${ROOT_PASS}" | chpasswd

          if [ -f /etc/pacman.conf ]; then
            FAMILY=arch
          else
            FAMILY=debian
          fi

          # ===========================================================================
          # 包安装助手
          # 踩过的坑: `apt-get install -y a b c || true`, 只要其中一个包名在源里不存在,
          #   apt 会 exit 100 并且 **整组一个都不装**, 而 `|| true` 把错误吞掉 —— 结果 rootfs 里
          #   连 systemd / openssh-server / NetworkManager 都没有, 构建"成功"但刷上是个废系统。
          #   现场 (Ubuntu 26.04 构建日志):
          #     E: Unable to locate package crda
          #     Failed to enable unit: Unit NetworkManager.service does not exist
          #     Failed to enable unit: Unit wpa_supplicant@wlan0.service does not exist
          #     Failed to enable unit: Unit ssh.service does not exist
          #   三条 Failed 全是同一个原因: crda 早就被删掉了 (regulatory.db 现在由 wireless-regdb
          #   提供 / 内核自带), 而这个不存在的包名把整组安装一起拖死, 报错又被 `|| true` 吞了。
          #   所以下面: 整组装 -> 失败就逐个装定位; core 包缺一个立刻退出, optional 包缺了只 warning
          #   (少个 dialog / htop 不该让整个 rootfs 白做, 但少 systemd 必须炸)。
          # 注意不要写 `[ cond ] && cmd` 这种裸形式: 在 set -e 下条件为假时整条语句返回非 0,
          #   会把脚本带崩。这里一律用 if/then。
          # ===========================================================================
          apt_has() {   # 源里有可安装的候选版本才算有 (只看包名存在不够, Candidate 是 (none) 也不行)
            local cand
            cand="$(apt-cache policy "$1" 2>/dev/null | sed -n 's/^ *Candidate: *//p')" || true
            if [ -n "$cand" ] && [ "$cand" != "(none)" ]; then return 0; fi
            return 1
          }

          apt_group() {  # apt_group core|optional 包...
            local kind="$1"; shift
            local p bad=() core_missing=()
            if apt-get install -y --no-install-recommends "$@" >/dev/null 2>&1; then
              echo "[pkg] 一次装好 $# 个 ($kind)"
              return 0
            fi
            echo "[pkg] 整组安装失败 (apt 遇到源里没有的包会整组放弃), 改为逐个安装定位问题包:"
            for p in "$@"; do
              if apt-get install -y --no-install-recommends "$p" >"/tmp/apt-$p.log" 2>&1; then
                echo "[pkg]   ok      $p"
              else
                echo "[pkg]   FAILED  $p  $(grep -m1 -E '^E:|Unable to locate|no installation candidate' "/tmp/apt-$p.log" || echo '(见 /tmp/apt-*.log)')"
                bad+=("$p")
                if [ "$kind" = core ]; then
                  core_missing+=("$p")
                fi
              fi
            done
            if [ "${#core_missing[@]}" -gt 0 ]; then
              echo "::error::核心包装不上: ${core_missing[*]} —— rootfs 会是废的, 直接中止 (查包名 / 源 / 网络)"
              return 1
            fi
            if [ "${#bad[@]}" -gt 0 ]; then
              echo "::warning::可选包装不上, 已跳过: ${bad[*]}"
            fi
            return 0
          }

          # --- systemd 单元: 先确认单元文件真的在, 再 enable ---
          # 以前直接 `systemctl enable X || true`: 单元不存在时 systemctl 打印红字返回非 0,
          # `|| true` 一吞, 日志里一片 Failed 却"构建成功", 刷上才发现 ssh 进不去。
          unit_exists() {   # 模板单元也认: wpa_supplicant@wlan0.service -> wpa_supplicant@.service
            local u="$1" t="$1" d
            case "$u" in *@*) t="${u%%@*}@.service" ;; esac
            for d in /run/systemd/system /etc/systemd/system /usr/lib/systemd/system /lib/systemd/system; do
              if [ -e "$d/$u" ]; then return 0; fi
              if [ "$t" != "$u" ] && [ -e "$d/$t" ]; then return 0; fi
            done
            return 1
          }

          enable_unit() {   # 存在且 enable 成功才返回 0; 否则返回 1, 由调用方决定是致命还是兜底
            local u="$1"
            if ! unit_exists "$u"; then
              echo "[unit] 没有 $u"
              return 1
            fi
            if systemctl enable "$u" >/dev/null 2>&1; then
              echo "[unit] enabled $u"
              return 0
            fi
            echo "::warning::systemctl enable $u 失败"
            return 1
          }

          if [ "$FAMILY" = "arch" ]; then
            pacman-key --init || true
            pacman-key --populate archlinuxarm || true
            # 先整系统升级 (Arch ARM 的 tarball 一般比仓库旧); 失败降级为 -Sy 只同步索引
            pacman -Syu --noconfirm || { echo "::warning::pacman -Syu 失败, 降级为 -Sy"; pacman -Sy --noconfirm || true; }
            # 核心包: 失败就炸 (以前挂 `|| true`, rootfs 会静默缺 systemd/ssh/NetworkManager)
            if ! pacman -S --noconfirm --needed systemd sudo networkmanager openssh \
                 wpa_supplicant iproute2 iw wireless_tools nano vim less htop dialog; then
              echo "::error::Arch 核心包安装失败 —— rootfs 会是废的, 中止"
              exit 1
            fi
            case "$DESKTOP" in
              kde)   pacman -S --noconfirm plasma-meta sddm konsole dolphin || true ;;
              phosh) pacman -S --noconfirm phosh || true ;;
              sway)  pacman -S --noconfirm sway || true ;;
              none|*) : ;;
            esac
            # MediaTek 固件 (README: 没有的话 WiFi/蓝牙/声卡/触控全废)
            pacman -S --noconfirm linux-firmware \
              || echo "::warning::linux-firmware 装不上 (WiFi/蓝牙/声卡/触控会废)"
            if [ -n "$EXTRA" ]; then pacman -S --noconfirm $EXTRA || true; fi
          else
            apt-get update
            # 核心包: 缺一个就 exit 1 (见文件头注释, Ubuntu 26.04 的 crda 就是这么把整组拖死的)
            apt_group core systemd systemd-sysv sudo openssh-server network-manager \
              wpasupplicant iproute2 iw ca-certificates
            # 可选包: 缺了只 warning (wireless-regdb 提供 regulatory.db, 管 5GHz 信道)
            apt_group optional wireless-regdb less nano vim htop dialog
            # MediaTek 固件 (README: 没有的话 WiFi/蓝牙/声卡/触控全废)
            # 包名随发行版变: Debian 13 拆出 firmware-mediatek / Ubuntu 只有整包 linux-firmware。
            # 以前只写 `apt-get install firmware-mediatek || echo warn` —— Ubuntu 上必然走到 warn,
            # 也就是 Ubuntu 的 rootfs 里一个 mediatek 固件都没有 (刷上 WiFi/蓝牙/声卡/触控全废)。
            FW=""
            for p in firmware-mediatek firmware-misc-nonfree firmware-linux-nonfree linux-firmware; do
              if apt_has "$p"; then FW="$p"; break; fi
            done
            if [ -n "$FW" ]; then
              echo "[fw] 选中的固件包: $FW"
              apt_group optional "$FW"
              nfw=0
              if [ -d /lib/firmware/mediatek ]; then
                nfw="$(ls -1 /lib/firmware/mediatek | wc -l)"
              fi
              echo "[fw] /lib/firmware/mediatek 里 $nfw 个文件"
              if [ "$nfw" = "0" ]; then
                echo "::warning::/lib/firmware/mediatek 是空的, WiFi/蓝牙可能起不来 (README: mediatek 固件必须有)"
              fi
            else
              echo "::warning::源里找不到 mediatek 固件包, 开机后自己补"
            fi
            if [ -n "$EXTRA" ]; then apt_group optional $EXTRA; fi
            apt-get clean
          fi

          # 预置 WiFi (留空不预置)
          if [ -n "$WIFI_SSID" ]; then
            mkdir -p /etc/wpa_supplicant
            printf 'ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev\nupdate_config=1\ncountry=CN\n\nnetwork={\n\tssid="%s"\n\tpsk="%s"\n}\n' \
              "$WIFI_SSID" "$WIFI_PASS" > /etc/wpa_supplicant/wpa_supplicant-wlan0.conf
            mkdir -p /etc/NetworkManager/system-connections
            printf '[connection]\nid=xaga-wifi\ntype=wifi\nautoconnect=true\n\n[wifi]\nssid=%s\nmode=infrastructure\n\n[wifi-security]\nkey-mgmt=wpa-psk\npsk=%s\n\n[ipv4]\nmethod=auto\n\n[ipv6]\nmethod=auto\n' \
              "$WIFI_SSID" "$WIFI_PASS" > /etc/NetworkManager/system-connections/xaga-wifi.nmconnection
            chmod 600 /etc/NetworkManager/system-connections/xaga-wifi.nmconnection
          fi

          # 网络管理服务: 这一段故意放在"有没有预置 WiFi"之外 —— 没预置 WiFi 时更要启用 NM,
          # 不然刷上是个完全没网管的系统 (以前两条 enable 都写在 WiFi 分支里)。
          # NetworkManager 会自己拉起并管理 wpa_supplicant (走 D-Bus); 再单独 enable
          # wpa_supplicant@wlan0 会跟它抢 wlan0 (Arch / Debian wiki 都明确说别同时开)。
          if enable_unit NetworkManager.service; then
            echo "[unit] 网络交给 NetworkManager"
          elif enable_unit wpa_supplicant@wlan0.service; then
            mkdir -p /etc/systemd/network
            printf '[Match]\nName=wlan0\n\n[Network]\nDHCP=yes\n' > /etc/systemd/network/25-wlan0.network
            enable_unit systemd-networkd.service || true
            echo "::warning::没有 NetworkManager, 退回 wpa_supplicant@wlan0 + systemd-networkd"
            if [ ! -f /etc/wpa_supplicant/wpa_supplicant-wlan0.conf ]; then
              echo "::warning::没预置 WiFi 配置, wpa_supplicant@wlan0 起来也没有可用网络"
            fi
          else
            echo "::warning::网络管理服务一个都没启用 (NetworkManager / wpa_supplicant@ 都不在)"
            if [ -n "$WIFI_SSID" ]; then
              echo "::warning::预置了 WiFi 但没有网管服务, 开机会连不上"
            fi
          fi

          # sshd 单元名: Arch = sshd.service, Debian/Ubuntu = ssh.service; 一个都启用不了就是废的
          SSH_UNIT=""
          for u in sshd.service ssh.service; do
            if unit_exists "$u"; then SSH_UNIT="$u"; break; fi
          done
          if [ -z "$SSH_UNIT" ]; then
            echo "::error::找不到 sshd.service / ssh.service (openssh-server 没装上?) —— 这个 rootfs 只能靠 ssh 进去"
            exit 1
          fi
          enable_unit "$SSH_UNIT" || { echo "::error::enable $SSH_UNIT 失败"; exit 1; }

          # Debian/Ubuntu 的 openssh-server 默认 PermitRootLogin prohibit-password; 本 rootfs
          # 只有 root 用户且用密码登录, 不放行的话 WiFi 配好了也 ssh 不进去。
          # 只写 sshd_config.d/ 里的 drop-in, 不动主配置; 不想要就删掉这个文件。
          if [ -d /etc/ssh ]; then
            mkdir -p /etc/ssh/sshd_config.d
            printf 'PermitRootLogin yes\n' > /etc/ssh/sshd_config.d/10-xaga-root-login.conf
            if [ -f /etc/ssh/sshd_config ] && ! grep -qE '^[[:space:]]*Include[[:space:]]+/etc/ssh/sshd_config\.d/' /etc/ssh/sshd_config; then
              # sshd 的取值规则是"先到先得", Include 必须在主配置最前面才生效
              { printf 'Include /etc/ssh/sshd_config.d/*.conf\n'; cat /etc/ssh/sshd_config; } > /tmp/sshd_config.new
              mv /tmp/sshd_config.new /etc/ssh/sshd_config
              echo "[ssh] 已把 Include sshd_config.d/*.conf 补到 sshd_config 最前面"
            fi
            echo "[ssh] PermitRootLogin yes (/etc/ssh/sshd_config.d/10-xaga-root-login.conf)"
          fi

          echo "xaga-setup done: $(head -2 /etc/os-release 2>/dev/null | tr '\n' ' ')"
          SETUP
          sudo chmod +x rootfs/tmp/xaga-setup.sh

          # === 伪文件系统挂载: 关进私有 mount namespace, 从根上杜绝泄漏到打包步骤 ===
          # 为什么必须这么做: 以前是在宿主 namespace 里 mount --rbind /sys /proc /dev,
          # chroot 完再 `umount -R ... || true`。chroot 里只要留下进程 (pacman/apt 的 postinst
          # 会拉起 dbus-daemon / polkitd), 或 --rbind 产生的子挂载还占着, umount -R 就 EBUSY;
          # 老写法带 `|| true`, 错误被吞掉 -> 挂载点活到「生成 ext4 镜像」步骤 -> rsync 走进活着的
          # sysfs:  read errors mapping ".../rootfs/sys/bus/acpi/drivers_autoprobe": No data available (61)
          #         send_files failed to open ".../rootfs/sys/bus/acpi/uevent": Permission denied (13)
          # rsync 退出码 23 (部分文件没传) -> 整个打包步骤失败, rootfs 一个都出不来。
          # unshare -m: 这些挂载只属于新建的 mount namespace, chroot 进程一退出, 内核连名字空间
          # 一起销毁; 宿主 namespace 里 rootfs/ 自始至终是干净目录 —— 不需要清理, 也没东西可清理。
          # (顺带不用 fuser -km 那套"杀进程腾挂载点"了: 它按 st_dev 匹配, 而 /dev /proc /sys 是
          #  bind mount, st_dev 与宿主完全相同, 反而可能把 runner 自己开着 /dev/null 的进程一起杀掉)
          sudo unshare --mount --propagation private /bin/bash -euo pipefail -c '
            root="$1"
            mount --rbind /proc "$root/proc"
            mount --rbind /sys  "$root/sys"
            mount --rbind /dev  "$root/dev"
            chroot "$root" /usr/bin/env -i \
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
              /bin/bash /tmp/xaga-setup.sh "${@:2}"
          ' _ "$PWD/rootfs" \
            "${ROOTFS_HOSTNAME:-xaga}" "${ROOTFS_PASSWORD:-root}" \
            "${WIFI_SSID:-}" "${WIFI_PASSWORD:-}" "${EXTRA_PKGS:-}" "${ARCH_DESKTOP:-kde}"
          sudo rm -f rootfs/tmp/xaga-setup.sh

          # === 自检: 宿主 namespace 里 rootfs 下不该有任何挂载点 ===
          # 判据用 /proc/self/mountinfo 第 5 字段 (挂载点) 的路径前缀匹配, 不用 `mount | grep`:
          #   后者会把 source/options 里的同名串也算命中; 而且 grep -q 命中就提前退出, mount 吃
          #   SIGPIPE, 在 pipefail 下整条管道非 0 -> 会被误判成"没有挂载"。
          leaked_mounts() {
            awk -v r="$PWD/rootfs" '$5 == r || index($5, r "/") == 1 { print $5 }' /proc/self/mountinfo
          }
          if [ -n "$(leaked_mounts)" ]; then
            echo "::warning::rootfs 下检测到残留挂载 (chroot 步骤没卸干净), 尝试清理:"
            leaked_mounts
            # 深 -> 浅: 必须先卸子挂载, 父挂载有子挂载时连 umount -l 都是 EBUSY
            for mp in $(leaked_mounts | awk '{ print length"\t"$0 }' | sort -rn | cut -f2); do
              sudo umount -l "$mp" 2>/dev/null || sudo umount -R "$mp" 2>/dev/null || true
            done
          fi
          if [ -n "$(leaked_mounts)" ]; then
            echo "::error::rootfs 下仍残留挂载点, 拒绝继续 (带着挂载点打包只会产出残缺镜像)"
            leaked_mounts
            exit 1
          fi
          echo "rootfs 下无残留挂载, 可以打包"

      - name: 生成 ext4 镜像并填充 rootfs
        run: |
          set -euo pipefail
          size="${IMG_SIZE:-6}"
          case "$size" in (*[!0-9]*) echo "::error::rootfs 容量必须是纯数字 (GB)"; exit 1 ;; esac

          # === 打包前置: rootfs 下必须一个挂载点都没有 ===
          # 判据同上一处: /proc/self/mountinfo 第 5 字段路径前缀匹配 (不用 `mount | grep`, 原因见上)
          leaked_mounts() {
            awk -v r="$PWD/rootfs" '$5 == r || index($5, r "/") == 1 { print $5 }' /proc/self/mountinfo
          }
          if [ -n "$(leaked_mounts)" ]; then
            echo "::warning::rootfs 下检测到残留挂载, 先清理:"
            leaked_mounts
            for mp in $(leaked_mounts | awk '{ print length"\t"$0 }' | sort -rn | cut -f2); do
              sudo umount -l "$mp" 2>/dev/null || sudo umount -R "$mp" 2>/dev/null || true
            done
          fi
          if [ -n "$(leaked_mounts)" ]; then
            echo "::error::rootfs 下仍有挂载点没卸掉 (chroot 步骤的 /proc /sys /dev 泄漏了), 拒绝打包"
            echo "::error::带着挂载点 rsync 会去读活着的 sysfs/procfs (Permission denied / No data available), 产出残缺镜像"
            leaked_mounts
            exit 1
          fi
          # 文件树本身也要像样 (防上一步静默失败后照样打个空镜像出来)
          test -s rootfs/etc/os-release || { echo "::error::rootfs 里没有 etc/os-release, 文件树不完整"; exit 1; }

          sudo truncate -s "${size}G" "rootfs-${TS}.img"
          sudo mkfs.ext4 -F -L xaga-rootfs "rootfs-${TS}.img"
          mkdir -p mnt
          sudo mount -o loop "rootfs-${TS}.img" mnt

          # 双保险 (残留挂载自检万一漏判, 也不让伪文件系统内容进镜像):
          #   --one-file-system  不跨文件系统 —— 残留的 sysfs/procfs/devtmpfs st_dev 不同, 不会进
          #   三条 --exclude     连目标内容都不要, 镜像里只留空的 /dev /proc /sys 挂载点
          #   (刷进 userdata 后这三个由内核 devtmpfs / init 系统开机时挂上, 镜像里不需要预置内容)
          rc=0
          sudo rsync -aHAX --numeric-ids --one-file-system --stats \
            --exclude='/dev/*' --exclude='/proc/*' --exclude='/sys/*' \
            rootfs/ mnt/ 2>&1 | tee /tmp/rsync-rootfs.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::group::rsync 填充镜像失败 (exit=$rc) —— 真实报错"
            grep -n -m 40 -E 'Permission denied|No data available|Input/output error|failed to open|read errors mapping|No space left|failed to write' \
              /tmp/rsync-rootfs.log || tail -n 40 /tmp/rsync-rootfs.log || true
            echo "::endgroup::"
            echo "::error::rsync 退出码 $rc (23 = 有文件没传上去), 镜像不完整, 已中止, 别拿去刷"
            exit 1
          fi

          # 断言: 伪文件系统目录必须是空的 (只剩挂载点), 关键目录必须有东西
          bad=0
          for d in dev proc sys; do
            n=$(sudo find "mnt/$d" -mindepth 1 -maxdepth 1 2>/dev/null | wc -l || true)
            printf 'mnt/%-5s -> 内容 %s 项\n' "$d" "$n"
            [ "$n" = "0" ] || { echo "::error::镜像里的 /$d 不是空的 (伪文件系统内容漏进去了)"; bad=1; }
          done
          for d in usr etc lib; do
            sudo test -e "mnt/$d" || { echo "::error::镜像里缺 /$d, 文件树不完整"; bad=1; }
          done
          [ "$bad" = "0" ] || exit 1

          sudo df -h mnt | tail -1
          sync
          sudo umount mnt
          sudo chown "$(id -u):$(id -g)" "rootfs-${TS}.img"
          ls -lh "rootfs-${TS}.img"

      - name: 转 sparse 镜像 + pigz 压缩 (超 2GB 自动分卷)
        run: |
          set -euo pipefail
          img2simg "rootfs-${TS}.img" "rootfs-sparse-${TS}.img"
          rm -f "rootfs-${TS}.img"
          # -k: 保留 sparse 原图 (README 产物 rootfs-sparse-<时间戳>.img)
          pigz -9 -k -p"$(nproc)" "rootfs-sparse-${TS}.img"
          ls -lh "rootfs-sparse-${TS}.img.gz"
          bytes=$(stat -c%s "rootfs-sparse-${TS}.img.gz")
          if [ "$bytes" -gt 2000000000 ]; then
            split -b 1900M -d -a 2 "rootfs-sparse-${TS}.img.gz" "rootfs-sparse-${TS}.img.gz.part-"
            rm -f "rootfs-sparse-${TS}.img.gz"
            echo "已分卷 (Release 单文件上限 2GB), 合并: cat rootfs-sparse-${TS}.img.gz.part-* > rootfs-sparse-${TS}.img.gz"
          fi
          ls -lh rootfs-sparse-${TS}* || true

      - name: 上传 rootfs 镜像
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-sparse
          path: rootfs-sparse-${{ needs.prepare.outputs.ts }}*
          if-no-files-found: error
          compression-level: 0

  # ---------------------------------------------------------------------------
  # 汇总产物 (Release 前收尾)
  # ---------------------------------------------------------------------------
  collect:
    name: 汇总产物
    needs: [prepare, build-boot, build-rootfs]
    if: ${{ always() && !failure() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COLLECT: ${{ inputs.collect_artifacts }}
    steps:
      - name: 判断是否需要汇总
        id: gate
        run: |
          set -euo pipefail
          if [ "${COLLECT:-true}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载全部产物
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: 生成 SHA256SUMS 与构建信息
        if: ${{ steps.gate.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          cd out
          ls -lh
          sha256sum -- * > SHA256SUMS
          {
            echo "xaga-mt6895-mainline-build"
            echo "Run ID:   ${{ github.run_id }}"
            echo "构建任务: ${{ needs.prepare.outputs.short_target }}"
            echo "内核分支: ${{ inputs.kernel_branch }}"
            echo "rootfs:   ${{ inputs.rootfs_distro }} (桌面: ${{ inputs.arch_desktop }})"
            echo "时间:     $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            echo "刷写:"
            echo "  fastboot flash boot boot-<时间戳>.img"
            echo "  fastboot flash userdata rootfs-sparse-<时间戳>.img"
            echo "  fastboot reboot"
            echo "  首次开机后: resize2fs /dev/sdc86"
          } > BUILD-INFO.txt
          cat BUILD-INFO.txt

      - name: 上传汇总产物
        if: ${{ steps.gate.outputs.run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: all-artifacts
          path: out/*
          if-no-files-found: error
          compression-level: 0

  # ---------------------------------------------------------------------------
  # 发布 Release (永久资源, 不过期)
  # ---------------------------------------------------------------------------
  release:
    name: 发布 Release
    needs: [prepare, build-boot, build-rootfs]
    if: ${{ always() && !failure() && !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PUBLISH: ${{ inputs.publish_release }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # gh release create 必须在 git 仓库里跑 (它要 git remote 推断仓库 / target),
      # 少了这一步就会报: failed to run git: fatal: not a git repository
      - name: 检出仓库
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载全部产物
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: 写 Release 说明
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          cat > NOTES.md <<EOF
          ## xaga 自动构建 ${{ needs.prepare.outputs.ts }}

          - 构建任务: ${{ needs.prepare.outputs.short_target }}
          - 内核分支: \`${{ inputs.kernel_branch }}\`
          - rootfs: \`${{ inputs.rootfs_distro }}\` / 桌面 \`${{ inputs.arch_desktop }}\` / 容量 ${{ inputs.rootfs_size }}G
          - 上游内核: [MT6895-Mainline/linux](https://github.com/MT6895-Mainline/linux) / initramfs: [MT6895-Mainline/initramfs](https://github.com/MT6895-Mainline/initramfs)
          - 运行记录: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### 刷写
          \`\`\`bash
          # MTK v4 boot header 不支持 fastboot boot, 必须刷到对应槽位
          fastboot flash boot boot-<时间戳>.img
          fastboot flash userdata rootfs-sparse-<时间戳>.img
          fastboot reboot
          \`\`\`

          > 若 rootfs 产物是 \`.gz.part-00/.gz.part-01\` 分卷, 先合并:
          > \`cat rootfs-sparse-<时间戳>.img.gz.part-* > rootfs-sparse-<时间戳>.img.gz\`

          ### 首次开机
          \`\`\`bash
          resize2fs /dev/sdc86   # 撑满 userdata
          \`\`\`
          EOF

      - name: 创建 Release
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          set -euo pipefail
          tag="build-${{ needs.prepare.outputs.ts }}"
          repo="${GH_REPO}"
          # GitHub Release 单文件上限 2GB: 超限的大文件留在 Action Artifacts 里
          mapfile -t allfiles < <(find out -maxdepth 1 -type f -size -2000000000c | sort)
          # Release 不允许同名 asset (422 ReleaseAsset.name already exists), 按 basename 去重
          declare -A seen=()
          files=()
          for f in "${allfiles[@]}"; do
            b="$(basename "$f")"
            if [ -z "${seen[$b]:-}" ]; then
              seen[$b]="$f"
              files+=("$f")
            else
              echo "跳过同名: $f (已选 ${seen[$b]})"
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::没有可发布的产物 (单文件上限 2GB, 大文件请从 Action Artifacts 下载)"
            exit 1
          fi
          echo "--- 待发布 (${#files[@]} 个) ---"
          printf '%s\n' "${files[@]}"
          # --repo 显式给, 别让 gh 去猜 (工作目录不是 git 仓库时会直接炸)
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release $tag 已存在, 改成追加上传 (--clobber 覆盖同名文件)"
            gh release upload "$tag" "${files[@]}" --repo "$repo" --clobber
          else
            gh release create "$tag" "${files[@]}" --repo "$repo" \
              --title "xaga 构建 ${{ needs.prepare.outputs.ts }} (${{ needs.prepare.outputs.short_target }})" \
              --notes-file NOTES.md
          fi
          echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"

  # ---------------------------------------------------------------------------
  # 构建完成推送通知 (喵提醒 / Server酱)
  # ---------------------------------------------------------------------------
  notify:
    name: 构建完成通知
    needs: [prepare, upstream-check, build-boot, build-rootfs, collect, release]
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEND_NOTIFY: ${{ inputs.send_notification }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 判断是否需要推送通知
        id: gate
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${SEND_NOTIFY:-true}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 推送构建结果
        if: ${{ steps.gate.outputs.run == 'true' }}
        env:
          MEOW_WEBHOOK: ${{ secrets.MEOW_WEBHOOK }}
          MEOW_SECRET: ${{ secrets.MEOW_SECRET }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          status="success"
          for r in "${{ needs.upstream-check.result }}" "${{ needs.build-boot.result }}" \
                   "${{ needs.build-rootfs.result }}" "${{ needs.collect.result }}" \
                   "${{ needs.release.result }}"; do
            case "$r" in
              failure) status="failure" ;;
              cancelled) [ "$status" = "success" ] && status="cancelled" ;;
            esac
          done
          msg="任务: ${{ needs.prepare.outputs.short_target }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            msg="${msg}
          rootfs: ${{ inputs.rootfs_distro }} / ${{ inputs.arch_desktop }} / ${{ inputs.rootfs_size }}G
          Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/build-${{ needs.prepare.outputs.ts }}"
          else
            msg="上游更新检测: (${{ needs.upstream-check.result }}) 检测到更新会自动触发 Boot 构建"
          fi
          python3 .github/bot.py \
            --notify \
            --status "$status" \
            --title "xaga 构建$( [ "$status" = "success" ] && echo '成功 ✅' || echo '失败 ❌' )" \
            --artifact-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --message "$msg"
